plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'app.cash.paparazzi'
}
def rebuildNative = providers.gradleProperty('rebuildNative').orElse('true').get().toBoolean()
android {
    namespace 'app.paper.print'
    compileSdk 35
    defaultConfig {
        applicationId 'app.paper.print'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        if (rebuildNative) {
            ndk { abiFilters 'arm64-v8a' }
            externalNativeBuild { cmake { arguments '-DANDROID_STL=none' } }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    testOptions {
        unitTests { includeAndroidResources = true }
        unitTests.all { systemProperty 'paper.profile', file('src/main/assets/ivec_g3010_experimental.json').absolutePath }
    }
    buildTypes { release { minifyEnabled false } }
    if (rebuildNative) {
        ndkVersion '27.2.12479018'
        externalNativeBuild { cmake { path file('../native/CMakeLists.txt'); version '3.22.1' } }
        sourceSets { main { jniLibs.srcDirs = [] } }
    }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2025.03.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
